baseURL = 'https://mandos.net.pl'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
disableDefaultLanguageRedirect = false
copyright = "Marek Maksimczyk" # Footer copyright holder, otherwise will use site title

[module]
  [module.imports]
    # path = 'github.com/vimux/mainroad'
    path = 'github.com/chipzoller/hugo-clarity'

[[cascade]]
  [cascade.params]
    categories = ['projects']
  [cascade.target]
    kind = 'page'
    path = '/projects/**'

[[cascade]]
  [cascade.params]
    categories = ['tech']
    toc = true
  [cascade.target]
    kind = 'page'
    path = '/blog/tech/**'
